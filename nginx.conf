worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/nginx_client_body;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    proxy_temp_path       /tmp/nginx_proxy;
    scgi_temp_path        /tmp/nginx_scgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;

    client_max_body_size    30M;
    client_body_buffer_size 128k;

    fastcgi_buffer_size       128k;
    fastcgi_buffers           8 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_max_temp_file_size 0;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        location = / {
            fastcgi_pass php:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param PATH_INFO "";
        }

        location /public/ {
            alias /var/www/html/public/;
            try_files $uri =404;
            expires 1y;
            access_log off;
        }

        location /uploads/ {
            alias /var/www/html/uploads/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Deny script execution for anything under /uploads/ or /Uploads/ — user-submitted
        # files (payment proofs, avatars, etc.) must never be runnable as code, even if
        # someone manages to upload a disguised .php file.
        location ~* ^/uploads/.*\.(php|php\d|phtml|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
            return 403;
        }

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 120;
        }

        # Block direct access to internal PHP dirs, including all subpaths
        # (the previous regex only matched the exact top-level path, e.g. "/config",
        # and did NOT match "/config/db.php", leaving DB credentials/logic directly
        # executable by anyone who requested the file by name).
        location ~* ^/(config|includes|storage|migrations)(/|$) {
            deny all;
            return 403;
        }

        # Block dotfiles and env-style files anywhere in the tree
        location ~* (^|/)(\.git|\.env(\..*)?|\.user\.ini)$ {
            deny all;
            return 403;
        }

        # Never allow .sql, .md, .log, or backup files to be served
        location ~* \.(sql|md|log|bak|sh)$ {
            deny all;
            return 403;
        }

        location ~ /\. {
            deny all;
        }
    }
}
