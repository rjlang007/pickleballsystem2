name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Frontend URL for health check'
        required: true
        default: 'https://your-app.railway.app/api/health.php'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Check PHP syntax
      shell: bash
      run: |
        set -euo pipefail
        find . -type f -name '*.php' \
          -not -path './.git/*' \
          -not -path './vendor/*' \
          -print0 | xargs -0 -n1 php -l

  deploy:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway deploy --yes
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Run database migrations
      run: |
        railway run -- bash -lc 'psql "$DATABASE_URL" -f migrations/v2_multi_court.sql && psql "$DATABASE_URL" -f migrations/020_open_play_tournament.sql && psql "$DATABASE_URL" -f migrations/021_avatar_columns.sql'
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Health check
      if: ${{ github.event_name == 'workflow_dispatch' || vars.APP_URL != '' }}
      run: |
        health_url="${{ github.event.inputs.app_url || vars.APP_URL }}"
        curl --fail --silent --show-error --retry 5 --retry-delay 10 "$health_url"
